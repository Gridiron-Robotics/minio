# Shared MinIO object store for the Gridiron ERP estate — replaces AWS S3.
#
# Three services on the estate's shared network:
#   minio            the S3 engine (UNMODIFIED upstream) + console
#   minio-mcp        Contract A MCP sidecar (../mcp) — how the brain/modules
#                    talk to storage as MCP tools
#   minio-bootstrap  one-shot `mc` init: buckets, per-module service accounts,
#                    tenant-scoped policies (see bootstrap.sh)
#
# Secrets come from a gitignored .env (copy .env.example). Image tags are pinned
# (no floating :latest on the infra/money path — estate supply-chain rule).
name: gridiron-minio

networks:
  erp_shared_network:
    external: true

volumes:
  minio_data:

services:
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      # Single login: native OIDC federation against the erp realm. Console +
      # STS logins delegate to Keycloak. All optional — unset = local root only.
      MINIO_IDENTITY_OPENID_CONFIG_URL: ${MINIO_OIDC_CONFIG_URL:-}
      MINIO_IDENTITY_OPENID_CLIENT_ID: ${MINIO_OIDC_CLIENT_ID:-}
      MINIO_IDENTITY_OPENID_CLIENT_SECRET: ${MINIO_OIDC_CLIENT_SECRET:-}
      MINIO_IDENTITY_OPENID_CLAIM_NAME: ${MINIO_OIDC_CLAIM_NAME:-policy}
      MINIO_IDENTITY_OPENID_SCOPES: "openid,profile,email"
      MINIO_IDENTITY_OPENID_DISPLAY_NAME: "Gridiron SSO"
      # Encryption-at-rest is enabled by pointing at a KES/KMS endpoint (SSE-KMS).
      MINIO_KMS_KES_ENDPOINT: ${MINIO_KMS_KES_ENDPOINT:-}
      MINIO_KMS_KES_KEY_NAME: ${MINIO_KMS_KES_KEY_NAME:-}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_S3_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks: [erp_shared_network]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio-bootstrap:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    # Load .env so the per-module S3_KEY_<MODULE>/S3_SECRET_<MODULE> pairs reach
    # bootstrap.sh without enumerating each here (it mints one scoped svcacct per
    # module that has a pair). Optional file — absent in a bare checkout.
    env_file:
      - path: .env
        required: false
    environment:
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      # module service-account keys (scoped by policy in bootstrap.sh)
      MCP_MINIO_ACCESS_KEY: ${MCP_MINIO_ACCESS_KEY:?}
      MCP_MINIO_SECRET_KEY: ${MCP_MINIO_SECRET_KEY:?}
      # space-separated tenant + module lists to pre-provision buckets for
      BOOTSTRAP_TENANTS: ${BOOTSTRAP_TENANTS:-default}
      BOOTSTRAP_MODULES: ${BOOTSTRAP_MODULES:-safedocs nocobase gdc floorplans bigcapital lago inventree horilla openproject marketing orders inventory}
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    volumes:
      - ./bootstrap.sh:/bootstrap.sh:ro
      - ./policies:/policies:ro
    networks: [erp_shared_network]
    restart: "no"

  minio-mcp:
    build:
      context: ../mcp
    # Pinned, immutable reference — no floating tags on the infra path (estate
    # supply-chain rule). The `build:` block above is what produces this tag
    # locally; the required variable is what stops an unlabelled build from
    # masquerading as a release. Set MINIO_MCP_IMAGE_TAG to a released tag or git sha.
    image: ghcr.io/gridiron-robotics/minio-mcp:${MINIO_MCP_IMAGE_TAG:?set MINIO_MCP_IMAGE_TAG to a released image tag or sha}
    container_name: minio-mcp
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_MCP_ADDR: ":8090"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_SECURE: "false"
      MINIO_ACCESS_KEY: ${MCP_MINIO_ACCESS_KEY:?}
      MINIO_SECRET_KEY: ${MCP_MINIO_SECRET_KEY:?}
      # Caller gate — the brain/gateways present this bearer. REQUIRED: the
      # sidecar refuses to boot without it (exit 78), so compose fails fast here
      # rather than starting a server that authenticates no one.
      MCP_AUTH_TOKEN: "${MINIO_MCP_TOKEN:?set MINIO_MCP_TOKEN — the Contract-A bearer; must match the brain's GATEWAY_TOKENS[minio-mcp]}"
      MINIO_PRESIGN_EXPIRY: ${MINIO_PRESIGN_EXPIRY:-15m}
      # Self-heal rail (OpenObserve/OTLP). OPTIONAL — all unset = a silent no-op
      # (unlike the auth token, telemetry must never be a boot dependency). When
      # the endpoint is set, a >=500 storage failure ships a level=error record
      # under service.name=minio-mcp, which fires the estate self-heal alert.
      OTEL_ENABLED: ${OTEL_ENABLED:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-minio-mcp}
    ports:
      - "${MINIO_MCP_PORT:-8090}:8090"
    networks: [erp_shared_network]
    restart: unless-stopped
